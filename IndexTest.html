<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUTODIGITAL | Digitalizacija naručivanja vaših proizvoda</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome ikonice -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            orange: '#FF5722',
                            orangeHover: '#E64A19',
                            dark: '#1E293B',
                            slate: '#0F172A',
                            viber: '#7360F2',
                            whatsapp: '#25D366',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .custom-radio:checked + label {
            border-color: #FF5722;
            background-color: rgba(255, 87, 34, 0.1);
        }
        .color-radio:checked + label {
            border-color: #FF5722;
            box-shadow: 0 0 0 2px #FF5722;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
    </style>
</head>
<body class="min-h-screen pb-12 flex flex-col justify-between">

    <!-- Zaglavlje / Header -->
    <header style="background: #1a1a1a; padding: 15px 20px; border-bottom: 3px solid #ff6600;">
        <div style="max-width: 1000px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 15px; flex-wrap: wrap;">
            <!-- Logo i Naslov -->
            <div style="display: flex; align-items: center; gap: 15px;">
                <img src="Images/Logo.png" alt="AUTODIGITAL Logo" style="height: 55px; width: auto; object-fit: contain;">
                <div>
                    <h1 style="color: #ffffff; margin: 0; font-size: 26px; text-transform: uppercase; letter-spacing: 1px;">AUTODIGITAL</h1>
                    <p style="color: #cccccc; margin: 3px 0 0 0; font-size: 14px;">Digitalni Marketing</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Glavni Sadržaj -->
    <main class="max-w-6xl mx-auto px-4 py-8 w-full">

        <!-- Hero Tekst -->
        <div class="text-center mb-10">
            <h2 class="text-3xl sm:text-4xl font-extrabold text-white mb-3">Zatražite ponudu</h2>
            <p class="text-slate-400 max-w-2xl mx-auto text-sm sm:text-base">Odaberite željene dimenzije proizvoda, materijal i dodatne usluge, a zatim nam pošaljite direktan upit putem WhatsApp-a ili SMS-a.</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- LEVA KOLONA: KONFIGURATOR -->
            <div class="lg:col-span-7 space-y-6">

                <!-- 1. Tip proizvoda sa slikama i osnovnim cijenama po m2 -->
                <div class="bg-slate-800/60 backdrop-blur-sm border border-slate-700/60 p-5 rounded-2xl shadow-xl">
                    <label class="block text-sm font-semibold text-brand-orange uppercase tracking-wider mb-4">1. Izaberite Tip Proizvoda</label>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="fenceTypeContainer">
                        
                        <div>
                            <input type="radio" id="type1" name="fenceType" value="ProizvodJedan" data-price="25" checked class="hidden custom-radio">
                            <label for="type1" class="flex flex-col p-3 bg-slate-900/80 border-2 border-slate-700 rounded-xl cursor-pointer hover:border-slate-500 transition-all h-full">
                                <img src="Images/Proizvod.jpg" alt="ProizvodJedan" class="w-full h-28 object-cover rounded-lg mb-2 border border-slate-700">
                                <div class="flex items-center justify-between gap-2">
                                    <span class="font-semibold text-slate-200">ProizvodJedan</span>
                                    <span class="text-xs font-bold bg-brand-orange/20 text-brand-orange px-2 py-0.5 rounded-md">25 €/m²</span>
                                </div>
                                <div class="text-xs text-slate-400 mt-1">Opis proizvoda1</div>
                            </label>
                        </div>

                        <div>
                            <input type="radio" id="type2" name="fenceType" value="ProizvodDva" data-price="32" class="hidden custom-radio">
                            <label for="type2" class="flex flex-col p-3 bg-slate-900/80 border-2 border-slate-700 rounded-xl cursor-pointer hover:border-slate-500 transition-all h-full">
                                <img src="Images/ProizvodDva.jpg" alt="ProizvodDva" class="w-full h-28 object-cover rounded-lg mb-2 border border-slate-700">
                                <div class="flex items-center justify-between gap-2">
                                    <span class="font-semibold text-slate-200">ProizvodDva</span>
                                    <span class="text-xs font-bold bg-brand-orange/20 text-brand-orange px-2 py-0.5 rounded-md">32 €/m²</span>
                                </div>
                                <div class="text-xs text-slate-400 mt-1">Opis proizvoda dva</div>
                            </label>
                        </div>

                        <div>
                            <input type="radio" id="type3" name="fenceType" value="ProizvodTri" data-price="40" class="hidden custom-radio">
                            <label for="type3" class="flex flex-col p-3 bg-slate-900/80 border-2 border-slate-700 rounded-xl cursor-pointer hover:border-slate-500 transition-all h-full">
                                <img src="Images/ProizvodTri.jpg" alt="ProizvodTri" class="w-full h-28 object-cover rounded-lg mb-2 border border-slate-700">
                                <div class="flex items-center justify-between gap-2">
                                    <span class="font-semibold text-slate-200">ProizvodTri</span>
                                    <span class="text-xs font-bold bg-brand-orange/20 text-brand-orange px-2 py-0.5 rounded-md">40 €/m²</span>
                                </div>
                                <div class="text-xs text-slate-400 mt-1">Opis trećeg proizvoda</div>
                            </label>
                        </div>

                        <div>
                            <input type="radio" id="type4" name="fenceType" value="ProizvodČetiri" data-price="55" class="hidden custom-radio">
                            <label for="type4" class="flex flex-col p-3 bg-slate-900/80 border-2 border-slate-700 rounded-xl cursor-pointer hover:border-slate-500 transition-all h-full">
                                <img src="Images/Proizvodcetiri.jpg" alt="ProizvodČetiri" class="w-full h-28 object-cover rounded-lg mb-2 border border-slate-700">
                                <div class="flex items-center justify-between gap-2">
                                    <span class="font-semibold text-slate-200">ProizvodČetiri</span>
                                    <span class="text-xs font-bold bg-brand-orange/20 text-brand-orange px-2 py-0.5 rounded-md">55 €/m²</span>
                                </div>
                                <div class="text-xs text-slate-400 mt-1">Opis</div>
                            </label>
                        </div>

                    </div>
                </div>

                <!-- 2. Dimenzije -->
                <div class="bg-slate-800/60 backdrop-blur-sm border border-slate-700/60 p-5 rounded-2xl shadow-xl">
                    <label class="block text-sm font-semibold text-brand-orange uppercase tracking-wider mb-4">2. Unesite Dimenzije</label>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-2">Ukupna dužina proizvoda (u metrima)</label>
                            <div class="relative">
                                <input type="number" id="lengthInput" min="1" max="1000" value="30" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white font-bold focus:outline-none focus:border-brand-orange transition-all pl-10">
                                <i class="fa-solid fa-ruler-horizontal absolute left-3.5 top-3.5 text-slate-500"></i>
                                <span class="absolute right-4 top-3 text-slate-400 font-semibold text-sm">m</span>
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-2">Visina proizvoda</label>
                            <div class="relative">
                                <select id="heightSelect" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white font-medium focus:outline-none focus:border-brand-orange transition-all appearance-none pl-10 cursor-pointer">
                                    <option value="1.0">100 cm (1.0 m)</option>
                                    <option value="1.2">120 cm (1.2 m)</option>
                                    <option value="1.5" selected>150 cm (1.5 m)</option>
                                    <option value="1.7">170 cm (1.7 m)</option>
                                    <option value="2.0">200 cm (2.0 m)</option>
                                </select>
                                <i class="fa-solid fa-ruler-vertical absolute left-3.5 top-3.5 text-slate-500"></i>
                                <i class="fa-solid fa-chevron-down absolute right-4 top-4 text-slate-500 text-xs pointer-events-none"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 3. Odabir Boje -->
                <div class="bg-slate-800/60 backdrop-blur-sm border border-slate-700/60 p-5 rounded-2xl shadow-xl">
                    <label class="block text-sm font-semibold text-brand-orange uppercase tracking-wider mb-4">3. Odaberite Boju</label>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                        <div>
                            <input type="radio" id="color1" name="fenceColor" value="Siva" checked class="hidden color-radio">
                            <label for="color1" class="flex flex-col items-center justify-center p-3 bg-slate-900/80 border-2 border-slate-700 rounded-xl cursor-pointer hover:border-slate-500 transition-all text-center h-full">
                                <span class="w-8 h-8 rounded-full bg-[#383E42] border border-slate-500 mb-2 shadow-md"></span>
                                <span class="text-xs font-semibold text-slate-200">Siva</span>
                                <span class="text-[10px] text-slate-400">Metalik siva boja</span>
                            </label>
                        </div>

                        <div>
                            <input type="radio" id="color2" name="fenceColor" value="Zelena" class="hidden color-radio">
                            <label for="color2" class="flex flex-col items-center justify-center p-3 bg-slate-900/80 border-2 border-slate-700 rounded-xl cursor-pointer hover:border-slate-500 transition-all text-center h-full">
                                <span class="w-8 h-8 rounded-full bg-[#0F4326] border border-slate-500 mb-2 shadow-md"></span>
                                <span class="text-xs font-semibold text-slate-200">Zelena</span>
                                <span class="text-[10px] text-slate-400">Dodatni opis</span>
                            </label>
                        </div>

                        <div>
                            <input type="radio" id="color3" name="fenceColor" value="Crna" class="hidden color-radio">
                            <label for="color3" class="flex flex-col items-center justify-center p-3 bg-slate-900/80 border-2 border-slate-700 rounded-xl cursor-pointer hover:border
